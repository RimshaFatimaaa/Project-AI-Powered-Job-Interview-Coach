[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-coach"
version = "1.0.0"
description = "AI-Powered Job Interview Coach"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit==1.28.1",
    "python-dotenv==1.0.0",
    "openai==1.3.0",
    "supabase==2.0.2",
    "pandas==2.0.3",
    "plotly==5.17.0",
    "textstat==0.7.3",
    "transformers==4.33.0",
    "torch==2.5.0",
    "langchain==0.0.340",
    "langchain-community==0.0.5",
    "requests==2.31.0",
    "numpy==1.24.3"
]
